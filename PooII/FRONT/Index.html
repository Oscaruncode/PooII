<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Consumo de API de Ubicaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        section {
            background: #fff;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

            section h2 {
                margin-top: 0;
                color: #34495e;
            }

        input, button, select {
            padding: 10px;
            margin: 6px 4px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
        }

            button:hover {
                background-color: #2980b9;
            }

        pre {
            background-color: #eef2f5;
            padding: 10px;
            overflow-x: auto;
            border-radius: 8px;
            font-size: 13px;
        }

        #info-panel {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 1px 6px rgba(0, 0, 0, 0.05);
        }

        ul {
            padding-left: 20px;
        }

        #map {
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        select {
            min-width: 200px;
        }

        @media (max-width: 600px) {
            input, button, select {
                width: 100%;
                margin: 5px 0;
            }

            section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <h1>API de Ubicaciones</h1>

    <section>
        <h2>1. Obtener Ubicaciones Actuales</h2>
        <button onclick="obtenerUbicacionesActuales()">Cargar</button>
        <pre id="result-actuales"></pre>
    </section>

    <section>
        <h2>2. Obtener Historial por Persona</h2>
        <input type="number" id="personaIdHistorial" placeholder="ID de persona">
        <button onclick="obtenerHistorial()">Buscar Historial</button>
        <pre id="result-historial"></pre>
    </section>

    <section>
        <h2>3. Agregar Nueva Ubicación</h2>
        <input type="number" id="personaIdNueva" placeholder="ID de persona">
        <input type="text" id="direccionNueva" placeholder="Dirección">
        <button onclick="agregarUbicacion()">Agregar</button>
        <pre id="result-nueva"></pre>
    </section>

    <section>
        <h2>4. Visualización en Mapa</h2>
        <select id="person-select">
            <option value="">-- Selecciona una persona --</option>
        </select>
        <button id="show-current">Mostrar Ubicaciones Actuales</button>
        <button id="show-history">Mostrar Historial</button>
        <div id="map" style="height: 500px; width: 100%; margin-top: 20px;"></div>
        <div id="info-panel" style="margin-top: 20px;"></div>
    </section>

    <script>
        const baseUrl = 'https://localhost:7160/api/Ubicaciones';

        function obtenerUbicacionesActuales() {
            fetch(`${baseUrl}/Actuales`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result-actuales').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('result-actuales').textContent = "Error: " + error;
                });
        }

        function obtenerHistorial() {
            const personaId = document.getElementById('personaIdHistorial').value;
            fetch(`${baseUrl}/historial/${personaId}`)
                .then(response => {
                    if (!response.ok) throw new Error("No se encontró historial");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('result-historial').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('result-historial').textContent = "Error: " + error;
                });
        }

        function agregarUbicacion() {
            const personaId = document.getElementById('personaIdNueva').value;
            const direccion = document.getElementById('direccionNueva').value;

            fetch(`${baseUrl}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    personaId: parseInt(personaId),
                    direccion: direccion
                })
            })
                .then(response => {
                    if (!response.ok) throw new Error("Error al agregar");
                    return response.json();
                })
                .then(data => {
                    document.getElementById('result-nueva').textContent = JSON.stringify(data, null, 2);
                })
                .catch(error => {
                    document.getElementById('result-nueva').textContent = "Error: " + error;
                });
        }

        let map;
        let markers = [];
        let personas = [];

        function clearMarkers() {
            markers.forEach(marker => marker.setMap(null));
            markers = [];
        }

        function addMarker(position, title, map) {
            const marker = new google.maps.Marker({
                position,
                map,
                title
            });
            markers.push(marker);
        }

        async function loadPersons() {
            try {
                const response = await fetch('https://localhost:7160/Persona/personas');
                if (!response.ok) throw new Error('Error al cargar las personas');
                personas = await response.json();

                const select = document.getElementById('person-select');
                select.innerHTML = '<option value="">-- Selecciona una persona --</option>';
                personas.forEach(persona => {
                    const option = document.createElement('option');
                    option.value = persona.id;
                    option.textContent = `${persona.pNombre} ${persona.pApellido}`;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error al cargar personas:', error);
            }
        }

        window.iniciarMapa = function () {
            const coord = { lat: 4.4279668, lng: -75.2134661 };
            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 14,
                center: coord
            });
            loadPersons();
        };

        document.getElementById('show-current').addEventListener('click', async () => {
            try {
                const response = await fetch('https://localhost:7160/api/Ubicaciones/Actuales');
                if (!response.ok) throw new Error('Error al cargar ubicaciones');
                const ubicaciones = await response.json();

                clearMarkers();
                const bounds = new google.maps.LatLngBounds();

                ubicaciones.forEach(u => {
                    const pos = {
                        lat: u.latitud,
                        lng: u.longitud
                    };
                    addMarker(pos, u.marca, map);
                    bounds.extend(pos);
                });
                map.fitBounds(bounds);

                document.getElementById('info-panel').innerHTML = `
              <h3>Ubicaciones Actuales</h3>
              <ul>
                ${ubicaciones
                        .filter(u => u.latitud != null && u.longitud != null)
                        .map(u => `<li>${u.marca}: (${u.latitud}, ${u.longitud}) - ${new Date(u.fecha).toLocaleString()}</li>`)
                        .join('')}
              </ul>
            `;
            } catch (error) {
                document.getElementById('info-panel').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });

        document.getElementById('show-history').addEventListener('click', async () => {
            const personaId = document.getElementById('person-select').value;
            if (!personaId) {
                document.getElementById('info-panel').innerHTML = `<p>Selecciona una persona</p>`;
                return;
            }

            try {
                const response = await fetch(`https://localhost:7160/api/Ubicaciones/historial/${personaId}`);
                if (!response.ok) throw new Error('Error al cargar historial');
                const historial = await response.json();
                const persona = personas.find(p => p.id == personaId);
                const nombrePersona = persona ? `${persona.pNombre} ${persona.pApellido}` : 'Persona';

                clearMarkers();
                const bounds = new google.maps.LatLngBounds();

                historial.forEach((u, i) => {
                    const pos = { lat: u.latitud, lng: u.longitud };
                    addMarker(pos, `${nombrePersona} - ${i + 1}`, map);
                    bounds.extend(pos);
                });

                if (!bounds.isEmpty()) {
                    map.fitBounds(bounds);
                }

                document.getElementById('info-panel').innerHTML = `
              <h3>Historial de ${nombrePersona}</h3>
              <ul>
                ${historial.map((u, i) => `<li>(${u.latitud}, ${u.longitud}) - ${new Date(u.fecha).toLocaleString()}</li>`).join('')}
              </ul>
            `;
            } catch (error) {
                document.getElementById('info-panel').innerHTML = `<p>Error: ${error.message}</p>`;
            }
        });
    </script>

    <script async
            src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCq3AcDOFGE2ZtYX4pV_evmr-_5AFdHjr8&callback=iniciarMapa">
    </script>
</body>
</html>
